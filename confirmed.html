<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ResidenQuest - Cuenta confirmada</title>

  <style>
    body { font-family: Arial, sans-serif; background:#f5f3ff; margin:0; padding:24px; }
    .card { max-width:560px; margin:0 auto; background:#fff; border-radius:18px; padding:22px;
            box-shadow:0 8px 24px rgba(0,0,0,.08); }
    .title { font-size:22px; font-weight:900; color:#4b2aad; }
    .ok { margin-top:10px; font-size:16px; color:#222; }
    .hint { margin-top:10px; color:#666; line-height:1.5; }
    .btn { display:inline-block; margin-top:16px; padding:12px 14px; background:#673ab7; color:#fff;
           text-decoration:none; border-radius:12px; font-weight:800; }
  </style>
</head>

<body>
  <div class="card">
    <div class="title">ResidenQuest</div>

    <div class="ok" id="status">Verificando confirmación...</div>

    <div class="hint" id="hint">
      Espera un momento.
    </div>

    <a class="btn" href="#" onclick="window.close(); return false;">Cerrar</a>
  </div>

  <script>
    (() => {
      const query = new URLSearchParams(window.location.search);

      const hashText = window.location.hash.startsWith('#')
        ? window.location.hash.substring(1)
        : window.location.hash;

      const hash = new URLSearchParams(hashText);

      const error =
        query.get('error') ||
        hash.get('error') ||
        query.get('error_code') ||
        hash.get('error_code');

      const errorDescription =
        query.get('error_description') ||
        hash.get('error_description');

      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const type = hash.get('type');

      const status = document.getElementById('status');
      const hint = document.getElementById('hint');

      if (error || errorDescription) {
        status.textContent = '❌ No se pudo confirmar tu cuenta.';
        hint.textContent =
          'El enlace puede haber expirado o ya no ser válido. Vuelve a la app e intenta nuevamente.';
      } else if (
        accessToken &&
        refreshToken &&
        type === 'signup'
      ) {
        status.textContent = '✅ Tu cuenta ha sido confirmada.';
        hint.textContent =
          'Ya puedes volver a la app e iniciar sesión.';
      } else {
        status.textContent = 'ℹ️ No se encontró una confirmación válida.';
        hint.textContent =
          'Abre el enlace de confirmación directamente desde el correo que recibiste.';
      }

      // Remove tokens/error details from the visible URL/history.
      if (window.history.replaceState) {
        window.history.replaceState(
          null,
          document.title,
          window.location.pathname
        );
      }
    })();
  </script>
</body>
</html>
