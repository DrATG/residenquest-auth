<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Turnstile</title>

  <link
    rel="preconnect"
    href="https://challenges.cloudflare.com"
  />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .hint {
      color: #666;
      font-size: 14px;
      text-align: center;
    }
  </style>

  <script>
    const MESSAGE_TYPE = "residenquest-turnstile";

    let completed = false;
    let watchdogId = null;

    function send(value) {
      window.parent.postMessage(
        {
          type: MESSAGE_TYPE,
          value: String(value)
        },
        window.location.origin
      );
    }

    function complete(value) {
      if (completed) {
        return;
      }

      completed = true;

      if (watchdogId !== null) {
        window.clearTimeout(watchdogId);
      }

      send(value);
    }

    function onSuccess(token) {
      const value = (token || "").trim();

      if (!value) {
        complete("ERROR");
        return;
      }

      complete(value);
    }

    function onError() {
      complete("ERROR");
    }

    function onExpired() {
      complete("EXPIRED");
    }

    function onTimeout() {
      complete("ERROR");
    }

    watchdogId = window.setTimeout(function () {
      complete("ERROR");
    }, 45000);
  </script>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer>
  </script>
</head>

<body>
  <div class="wrap">
    <div class="hint">Verificando…</div>

    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAACNJalFqU3pVBzT2"
      data-callback="onSuccess"
      data-error-callback="onError"
      data-expired-callback="onExpired"
      data-timeout-callback="onTimeout"
      data-retry="never"
      data-refresh-expired="never">
    </div>
  </div>
</body>
</html>
